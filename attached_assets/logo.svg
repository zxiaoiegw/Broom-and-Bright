<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 210" fill="none">
  <title>TrueClean KC</title>

  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081748"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9860A"/>
      <stop offset="50%" stop-color="#F5B324"/>
      <stop offset="100%" stop-color="#FFE083"/>
    </linearGradient>
  </defs>

  <!-- Icon: sparkle + roof + window + swoosh -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- large sparkle -->
    <path d="M52 24 L60 46 L82 54 L60 62 L52 84 L44 62 L22 54 L44 46 Z" fill="url(#blueGrad)"/>
    <!-- small sparkle (yellow accent) -->
    <path d="M30 92 L34 102 L44 106 L34 110 L30 120 L26 110 L16 106 L26 102 Z" fill="url(#yellowGrad)"/>
    <!-- roof -->
    <path d="M34 138 L112 74 L190 138" stroke="url(#blueGrad)" stroke-width="10"/>
    <!-- chimney -->
    <path d="M172 92 L172 122" stroke="url(#blueGrad)" stroke-width="10"/>
    <!-- 4-pane window -->
    <path d="M96 130 h14 v14 h-14 Z M124 130 h14 v14 h-14 Z M96 158 h14 v14 h-14 Z M124 158 h14 v14 h-14 Z" fill="url(#blueGrad)"/>
    <!-- swoosh -->
    <path d="M30 158 C 74 190, 150 190, 194 158" stroke="url(#yellowGrad)" stroke-width="7"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" letter-spacing="1">
    <text x="214" y="98" font-size="80" fill="url(#blueGrad)">True</text>
    <text x="214" y="168" font-size="80" fill="url(#yellowGrad)">Clean</text>
  </g>

  <!-- KC badge -->
  <rect x="500" y="108" width="92" height="64" rx="14" stroke="url(#yellowGrad)" stroke-width="5"/>
  <text x="546" y="156" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" fill="url(#yellowGrad)" text-anchor="middle">KC</text>
</svg>
